name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic version tag such as v0.1.0-rc1" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image-name
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image-name.outputs.image }}:${{ github.ref_name }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Package chart for this tag
        id: chart
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          helm package deploy/k8s --version "$VERSION" --app-version "$RELEASE_TAG" --destination dist
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=dist/kro-studio-$VERSION.tgz" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR for chart publishing
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Publish chart to GHCR as OCI
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          CHART_FILE: ${{ steps.chart.outputs.file }}
        run: helm push "$CHART_FILE" "oci://ghcr.io/${OWNER,,}/charts"

      - name: Create clean kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kro-studio-release-smoke

      - name: Install published chart and check readiness
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.chart.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_PATH: ${{ steps.image-name.outputs.image }}
        run: |
          owner="${OWNER,,}"
          helm upgrade --install kro-studio "oci://ghcr.io/${owner}/charts/kro-studio" \
            --version "$VERSION" --namespace kro-studio --create-namespace \
            --set image.repository="$IMAGE_PATH" \
            --set image.tag="$RELEASE_TAG" \
            --set image.pullPolicy=IfNotPresent \
            --set auth.allowedHosts[0]=127.0.0.1
          kubectl rollout status deployment/kro-studio-kro-studio -n kro-studio --timeout=180s
          kubectl port-forward -n kro-studio svc/kro-studio-kro-studio 18080:80 >/tmp/kro-port-forward.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/ready; then exit 0; fi
            sleep 2
          done
          cat /tmp/kro-port-forward.log
          kubectl logs -n kro-studio deployment/kro-studio-kro-studio
          exit 1

      - name: Prepare release checksums
        shell: bash
        env:
          CHART_FILE: ${{ steps.chart.outputs.file }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf '%s  %s\n' "$IMAGE_DIGEST" "ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}" > dist/IMAGE-DIGEST.txt
          (cd dist && sha256sum "$(basename "$CHART_FILE")" IMAGE-DIGEST.txt > SHA256SUMS)

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          CHART_FILE: ${{ steps.chart.outputs.file }}
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" --generate-notes "${prerelease[@]}" \
            "$CHART_FILE" dist/IMAGE-DIGEST.txt dist/SHA256SUMS
