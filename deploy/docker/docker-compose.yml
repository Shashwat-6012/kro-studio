services:
  kro-studio:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "127.0.0.1:${UI_PORT:-8080}:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      Kubernetes__KubeconfigPath: /run/kubeconfig
      Kubernetes__Context: ${KUBECONTEXT:-docker-desktop}
    volumes:
      - ${KUBECONFIG_PATH:?Set KUBECONFIG_PATH to your kubeconfig path}:/run/kubeconfig:ro
